[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "Pyntb"
version = "2026.1.1"
authors = [
    { name = "Mews Labs", email = "emmanuel.cieren@mews-labs.com" },
]
description = "A toolbox to factorize some code utilities across various projects."
license = "APACHE-2.0"
readme = "README.md"
requires-python = ">=3.11, <3.15"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy >= 2.0.1",
]

[project.optional-dependencies]
examples = ["matplotlib", "scikit-learn", "scipy"]
test = ["pytest", "scikit-learn", "pylint"]
lint = ["ruff"]
dev = ["pyntb[examples,test,lint]"]

[project.urls]
"Homepage" = "https://github.com/mews-labs/pyntb"

[tool.ruff]
target-version = "py311"
line-length = 88
